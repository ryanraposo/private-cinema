<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>private cinema</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
    :root { --bg: #0f0a05; --accent: #ff6b6b; --text: #f5e8c7; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      height: 100vh; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .container { width: 100%; max-width: 1280px; padding: 20px; }
    h1 { font-size: 2.5rem; color: #ff9f9f; text-align: center; }
    .subtitle { text-align: center; opacity: 0.7; margin: 8px 0 30px; }
    .player-container {
      position: relative; background: #1a1208; border-radius: 16px;
      overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.7); aspect-ratio: 16/9;
    }
    #video { width: 100%; height: 100%; background: #000; }
    .status { position: absolute; top: 24px; left: 24px; font-size: 0.85rem; background: rgba(0,0,0,0.6); padding: 6px 12px; border-radius: 9999px; z-index: 20; }
    .heartbeat {
      position: absolute; top: 24px; right: 24px; width: 20px; height: 20px;
      border-radius: 50%; background: #4a9eff; box-shadow: 0 0 15px #4a9eff;
      animation: pulse 2s infinite; z-index: 20;
    }
    .heartbeat.synced { background: #4ade80; box-shadow: 0 0 15px #4ade80; animation: none; }
    .heartbeat.jitter { background: #facc15; animation-duration: 0.7s; }
    @keyframes pulse { 50% { transform: scale(1.2); } }
    .controls-tray {
      margin-top: 20px; background: rgba(26,18,8,0.95); border-radius: 12px; overflow: hidden;
    }
    .controls-tray summary { cursor: pointer; list-style: none; padding: 16px 20px; color: #ffb3b3; font-weight: 600; }
    .controls-tray summary::-webkit-details-marker { display: none; }
    .controls-tray summary::after { content: ' ▾'; }
    .controls-tray:not([open]) summary::after { content: ' ▸'; }
    .controls {
      display: flex; gap: 12px; flex-wrap: wrap; padding: 0 20px 20px;
    }
    input { flex: 1; padding: 16px; background: #2a2118; border: 2px solid #4a3728; color: white; border-radius: 8px; font-size: 1.05rem; }
    button { padding: 16px 32px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #ff8787; }
  </style>
</head>
<body>
  <div class="container">
    <h1>private cinema</h1>
    <p class="subtitle">just the two of us • perfectly in sync</p>
    
    <div class="player-container">
      <div class="status" id="status">Connecting...</div>
      <div class="heartbeat" id="heartbeat"></div>
      <video id="video" controls playsinline></video>
    </div>
    
    <details class="controls-tray">
      <summary>Video source tray</summary>
      <div class="controls">
        <input type="text" id="urlInput" placeholder="Paste direct video URL (e.g. mp4/webm link)">
        <button id="loadBtn">Load for Us</button>
        <button id="debugVideoBtn" type="button" title="Loads a public 52-second MP4 test clip">Load 52s Debug MP4</button>
      </div>
    </details>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
