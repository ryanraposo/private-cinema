<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>private cinema</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        
        :root {
            --bg: #0f0a05;
            --accent: #ff6b6b;
            --text: #f5e8c7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system_ui, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        header {
            text-align: center;
            padding: 10px 0;
        }
        
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ff9f9f;
        }
        
        .subtitle {
            font-size: 0.95rem;
            opacity: 0.7;
            margin-top: 4px;
        }
        
        .player-container {
            position: relative;
            background: #1a1208;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            aspect-ratio: 16 / 9;
        }
        
        #video {
            width: 100%;
            height: 100%;
            background: #000;
        }
        
        .controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .debug-menu {
            flex-basis: 100%;
        }

        .debug-menu summary {
            cursor: pointer;
            list-style: none;
            display: inline-block;
            color: #ffb3b3;
            font-weight: 600;
            padding: 4px 0;
        }

        .debug-menu summary::-webkit-details-marker { display: none; }
        .debug-menu summary::after { content: ' ▸'; }
        .debug-menu[open] summary::after { content: ' ▾'; }

        .debug-menu button {
            margin-top: 8px;
        }
        
        input[type="text"] {
            flex: 1;
            min-width: 300px;
            padding: 14px 18px;
            background: #2a2118;
            border: 2px solid #4a3728;
            color: var(--text);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        
        input[type="text"]:focus {
            border-color: var(--accent);
        }
        
        button {
            padding: 14px 28px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }
        
        button:hover {
            background: #ff8787;
            transform: translateY(-1px);
        }
        
        .heartbeat {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #4a9eff;
            box-shadow: 0 0 12px #4a9eff;
            animation: pulse 2s infinite;
            z-index: 10;
            transition: all 0.3s ease;
        }
        
        .heartbeat.synced {
            background: #4ade80;
            box-shadow: 0 0 12px #4ade80;
            animation: none;
        }
        
        .heartbeat.jitter {
            background: #facc15;
            box-shadow: 0 0 12px #facc15;
            animation: pulse 0.8s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        .status {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            border-radius: 9999px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>private cinema</h1>
            <p class="subtitle">just us • perfectly synced</p>
        </header>
        
        <div class="player-container">
            <div class="status" id="status">Connecting...</div>
            <div class="heartbeat" id="heartbeat"></div>
            <video id="video" controls playsinline></video>
        </div>
        
        <div class="controls">
            <input type="text" id="urlInput" placeholder="Paste direct video URL (mp4, webm...)" />
            <button id="loadBtn">Load for Us</button>
            <details class="debug-menu">
                <summary>Debug tools</summary>
                <button id="debugVideoBtn" type="button" title="Loads a public 52-second MP4 test clip">Load debug video</button>
            </details>
        </div>
    </div>

    <!-- Password screen (shared secret) -->
    <div id="passwordScreen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 20px;">
        <h1 style="color: #ff9f9f;">private cinema</h1>
        <p style="opacity: 0.8;">Enter the secret to enter</p>
        <input type="password" id="passwordInput" placeholder="shared secret" style="padding: 14px 20px; width: 280px; background: #2a2118; border: 2px solid #4a3728; color: white; border-radius: 8px; font-size: 1.1rem; text-align: center;">
        <button id="enterBtn" style="padding: 14px 40px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer;">Enter</button>
        <p id="passwordError" style="color: #ff6b6b; opacity: 0;">Incorrect secret</p>
    </div>

    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="./env.js"></script>
    <script src="script.js"></script>
</body>
</html>
